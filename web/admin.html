<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MacBill Admin</title>
<link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/admin.css">
</head>
<body>
<div id="login" class="loginwrap" hidden>
  <form class="glass logincard" id="lf">
    <div class="logo"><img src="/favicon.svg" alt="" width="34" height="34">MacBill Admin</div>
    <p class="muted">Sign in to manage enquiries, customers and subscriptions.</p>
    <label for="le">E-mail</label><input id="le" type="email" autocomplete="username" required>
    <label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
    <div class="err" id="lerr" hidden></div>
    <button class="btn pri" style="width:100%;justify-content:center;margin-top:6px">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <aside id="side">
    <div class="logo"><img src="/favicon.svg" alt="" width="34" height="34">MacBill</div>
    <nav id="menu"></nav>
    <div class="me"><span id="who"></span><button class="btn sm" id="out">Log out</button></div>
  </aside>
  <main>
    <header class="top"><button class="btn sm ghost" id="mb">☰</button><h1 id="title"></h1><a class="btn sm ghost" href="/" target="_blank" rel="noopener">View website ↗</a></header>
    <div id="view"></div>
  </main>
</div>
<div id="modal"></div><div id="toast"></div>
<script src="/admin.js"></script>
</body>
</html>
